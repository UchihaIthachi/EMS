# Publishes the architecture atlas (docs/diagrams.md -> docs/site/build.py) to GitHub Pages.
# One-time setup: Settings -> Pages -> Source: GitHub Actions, and allow branch k8s-native
# in Settings -> Environments -> github-pages -> Deployment branches.
name: atlas-pages

on:
  push:
    branches: [k8s-native, main]
    paths: [docs/diagrams.md, "docs/site/**", .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the atlas page from docs/diagrams.md
        run: python3 docs/site/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
