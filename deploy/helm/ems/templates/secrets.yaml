{{- if .Values.secrets.create }}
{{- $rmqPass := include "ems.required" (dict "ctx" . "key" "rabbitmqPassword") }}
apiVersion: v1
kind: Secret
metadata:
  name: mysql
  namespace: {{ .Release.Namespace }}
  labels: {{- include "ems.labels" (dict "ctx" . "name" "mysql") | nindent 4 }}
type: Opaque
stringData:
  root-password: {{ include "ems.required" (dict "ctx" . "key" "mysqlRootPassword") | quote }}
  employee-password: {{ include "ems.required" (dict "ctx" . "key" "employeeDbPassword") | quote }}
  department-password: {{ include "ems.required" (dict "ctx" . "key" "departmentDbPassword") | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq
  namespace: {{ .Release.Namespace }}
  labels: {{- include "ems.labels" (dict "ctx" . "name" "rabbitmq") | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.rabbitmq.user | quote }}
  password: {{ $rmqPass | quote }}
  # Used by the KEDA TriggerAuthentication (default vhost "/").
  amqp-uri: {{ printf "amqp://%s:%s@rabbitmq.%s.svc:5672/" .Values.rabbitmq.user ($rmqPass | urlquery) .Release.Namespace | quote }}
{{- end }}
