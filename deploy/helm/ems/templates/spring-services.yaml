{{- range $name, $svc := .Values.services }}
{{- $ctx := dict "ctx" $ "name" $name }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "ems.labels" $ctx | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "ems.labels" $ctx | nindent 4 }}
data:
  JAVA_TOOL_OPTIONS: {{ $.Values.java.toolOptions | quote }}
  SPRING_MAIN_LAZY_INITIALIZATION: {{ $.Values.java.lazyInit | quote }}
  {{- range $k, $v := $svc.env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "ems.labels" $ctx | nindent 4 }}
spec:
  {{- if not (or (dig "hpa" "enabled" false $svc) (dig "keda" "enabled" false $svc)) }}
  replicas: {{ $svc.replicas }}
  {{- end }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: {{- include "ems.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels: {{- include "ems.labels" $ctx | nindent 8 }}
      annotations:
        checksum/config: {{ toJson $svc.env | sha256sum | trunc 16 }}
        checksum/secrets: {{ toJson $.Values.secrets | sha256sum | trunc 16 }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      priorityClassName: ems-app
      terminationGracePeriodSeconds: 30
      securityContext: {{- include "ems.podSecurity" (dict) | nindent 8 }}
      {{- if $svc.spreadAcrossNodes }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "ems.selector" $ctx | nindent 14 }}
      {{- end }}
      {{- include "ems.waitFor" (dict "targets" $svc.waitFor) | nindent 6 }}
      containers:
        - name: app
          image: {{ include "ems.image" (dict "ctx" $ "image" $svc.image) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: {{ $name }} }
          {{- with $svc.secretEnv }}
          env:
            {{- range . }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef: { name: {{ .secret }}, key: {{ .key }} }
            {{- end }}
          {{- end }}
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec: { command: ["sh", "-c", "sleep 5"] }
          resources: {{- toYaml ($svc.resources | default $.Values.java.resources) | nindent 12 }}
          securityContext: {{- include "ems.containerSecurity" (dict "readOnly" true) | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "ems.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "ems.selector" $ctx | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: http }
{{- if dig "hpa" "enabled" false $svc }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "ems.labels" $ctx | nindent 4 }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ $name }} }
  minReplicas: {{ $svc.hpa.min }}
  maxReplicas: {{ $svc.hpa.max }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ $svc.hpa.cpu }} }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
{{- end }}
{{- $minReplicas := $svc.replicas | default 1 }}
{{- if $svc.hpa }}{{ $minReplicas = $svc.hpa.min }}{{ end }}
{{- if $svc.keda }}{{ $minReplicas = $svc.keda.min }}{{ end }}
{{- if and $svc.pdb (or (ge (int $minReplicas) 2) (not (dig "onlyWhenScaled" false $svc.pdb))) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "ems.labels" $ctx | nindent 4 }}
spec:
  minAvailable: {{ $svc.pdb.minAvailable }}
  selector:
    matchLabels: {{- include "ems.selector" $ctx | nindent 6 }}
{{- end }}
{{- end }}
