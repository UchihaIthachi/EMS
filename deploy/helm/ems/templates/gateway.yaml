{{- if .Values.gateway.enabled }}
# Proxy pod settings for kgateway: the only change needed for Pod Security "restricted"
# is the RuntimeDefault seccomp profile (the proxy already runs non-root without privileges).
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayParameters
metadata:
  name: {{ .Values.gateway.name }}-proxy
  namespace: {{ .Release.Namespace }}
  labels: {{- include "ems.labels" (dict "ctx" . "name" "gateway") | nindent 4 }}
spec:
  kube:
    podTemplate:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "ems.labels" (dict "ctx" . "name" "gateway") | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  infrastructure:
    parametersRef:
      group: gateway.kgateway.dev
      kind: GatewayParameters
      name: {{ .Values.gateway.name }}-proxy
  listeners:
    - { name: http, protocol: HTTP, port: 80 }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ems
  namespace: {{ .Release.Namespace }}
  labels: {{- include "ems.labels" (dict "ctx" . "name" "gateway") | nindent 4 }}
spec:
  parentRefs:
    - { name: {{ .Values.gateway.name }} }
  rules:
    # API traffic (longest prefix wins, so these beat "/")
    - matches:
        - path: { type: PathPrefix, value: /api }
        - path: { type: PathPrefix, value: /employee-service }
        - path: { type: PathPrefix, value: /department-service }
      backendRefs:
        - { name: api-gateway, port: 8080 }
    # Everything else is the single-page app
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - { name: frontend, port: 80 }
{{- end }}
