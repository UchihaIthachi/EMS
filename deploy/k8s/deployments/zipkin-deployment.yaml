apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
  namespace: ems-app
  labels:
    app: zipkin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zipkin
  template:
    metadata:
      labels:
        app: zipkin
    spec:
      containers:
        - name: zipkin
          image: openzipkin/zipkin:3
          ports:
            - containerPort: 9411
          livenessProbe:
            httpGet:
              path: /zipkin/health
              port: 9411
            initialDelaySeconds: 60
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /zipkin/health
              port: 9411
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"  # Was 100m
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
