# Stand-in for the Kubernetes Gateway + HTTPRoute (deploy/helm/ems/templates/gateway.yaml).
server {
    listen 80;
    location ~ ^/(api|employee-service|department-service)(/|$) {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / {
        proxy_pass http://frontend:8080;
    }
}
