# api-gateway: routes are static; Kubernetes DNS resolves the service names.
# Every value can be overridden with an environment variable (SPRING_*, SERVER_PORT, *_SERVICE_URL).
spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ---------- Routes ----------
# Paths the frontend uses (prefix stripped before forwarding)
spring.cloud.gateway.routes[0].id=employee-service-prefixed
spring.cloud.gateway.routes[0].uri=${EMPLOYEE_SERVICE_URL:http://employee-service:8080}
spring.cloud.gateway.routes[0].predicates[0]=Path=/employee-service/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1
spring.cloud.gateway.routes[1].id=department-service-prefixed
spring.cloud.gateway.routes[1].uri=${DEPARTMENT_SERVICE_URL:http://department-service:8080}
spring.cloud.gateway.routes[1].predicates[0]=Path=/department-service/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1
# Direct API paths
spring.cloud.gateway.routes[2].id=employee-api
spring.cloud.gateway.routes[2].uri=${EMPLOYEE_SERVICE_URL:http://employee-service:8080}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/employee-service/**
spring.cloud.gateway.routes[3].id=department-api
spring.cloud.gateway.routes[3].uri=${DEPARTMENT_SERVICE_URL:http://department-service:8080}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/department-controller/**

# Fail fast instead of hanging when a backend is down
spring.cloud.gateway.httpclient.connect-timeout=2000
spring.cloud.gateway.httpclient.response-timeout=10s

# ---------- Actuator: probes and metrics ----------
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.group.readiness.include=readinessState

# ---------- Logging (stdout only, see logback-spring.xml) ----------
logging.level.root=INFO
