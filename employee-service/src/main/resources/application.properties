# employee-service. Settings come from environment variables in Kubernetes
# (SPRING_DATASOURCE_URL/USERNAME/PASSWORD, SPRING_RABBITMQ_*, CLIENTS_DEPARTMENT_URL).
# The values below are local-development defaults only.
spring.application.name=employee-service
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ---------- Database ----------
spring.datasource.url=jdbc:mysql://localhost:3306/employee_db
spring.datasource.username=employee
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---------- RabbitMQ (events) ----------
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
ems.events.exchange=ems.events

# ---------- department-service client ----------
clients.department.url=http://department-service:8080
feign.client.config.department-service.connect-timeout=2000
feign.client.config.department-service.read-timeout=3000

# ---------- Actuator: probes and metrics ----------
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

# ---------- Logging (stdout only, see logback-spring.xml) ----------
logging.level.root=INFO

# ---------- Resilience (circuit breaker + time limiter on the department call) ----------
feign.circuitbreaker.enabled=true
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.slow-call-duration-threshold=2s
resilience4j.circuitbreaker.configs.default.slow-call-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=2
resilience4j.timelimiter.configs.default.timeout-duration=3s
management.health.circuitbreakers.enabled=true
