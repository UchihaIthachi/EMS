spring.application.name=${SPRING_APPLICATION_NAME:EMPLOYEE-SERVICE}
# spring.config.import=optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}
spring.config.import=optional:configserver:${CONFIG_SERVER_URI:http://config-server:8888}

# ========== Actuator for Prometheus ==========
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true

# ========== Logging ==========
logging.level.root=INFO
logging.file.name=logs/app.log
# Note: Logstash logging is configured through logback, not directly via properties
# spring.boot.message=${EMP_MSG:Employee up!}

# Default Spring profile
spring.profiles.default=kubernetes

# Feign client URL for Department Service (using Kubernetes service DNS)
feign.client.config.department-service.url=http://department-service:${DEPARTMENT_SERVICE_PORT:8081}/

# Database configuration
# spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3308/employee_db_1?createDatabaseIfNotExist=true}
# spring.datasource.url=${DATABASE_URL}
# spring.datasource.username=${DATABASE_USERNAME:root}
# spring.datasource.password=${DATABASE_PASSWORD:mysql}
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.MySQL8Dialect}
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}

# RabbitMQ configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Zipkin tracing
spring.zipkin.base-url=${ZIPKIN_BASE_URL:http://127.0.0.1:9411/}
spring.sleuth.sampler.probability=${SLEUTH_SAMPLER_PROBABILITY:1.0}
spring.zipkin.enabled=true

# Resilience4j Configuration
resilience4j.circuitbreaker.instances.EMPLOYEE-SERVICE.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.EMPLOYEE-SERVICE.eventConsumerBufferSize=10
resilience4j.circuitbreaker.instances.EMPLOYEE-SERVICE.failureRateThreshold=50
resilience4j.circuitbreaker.instances.EMPLOYEE-SERVICE.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.EMPLOYEE-SERVICE.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.EMPLOYEE-SERVICE.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.EMPLOYEE-SERVICE.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.EMPLOYEE-SERVICE.slidingWindowSize=10
resilience4j.circuitbreaker.instances.EMPLOYEE-SERVICE.slidingWindowType=COUNT_BASED

resilience4j.retry.instances.EMPLOYEE-SERVICE.maxRetryAttempts=3
resilience4j.retry.instances.EMPLOYEE-SERVICE.waitDuration=5s

resilience4j.ratelimiter.instances.EMPLOYEE-SERVICE.limitForPeriod=10
resilience4j.ratelimiter.instances.EMPLOYEE-SERVICE.limitRefreshPeriod=1s
resilience4j.ratelimiter.instances.EMPLOYEE-SERVICE.timeoutDuration=0ms
