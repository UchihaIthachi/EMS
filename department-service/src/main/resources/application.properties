# department-service. Settings come from environment variables in Kubernetes
# (SPRING_DATASOURCE_URL/USERNAME/PASSWORD, SPRING_RABBITMQ_*).
# The values below are local-development defaults only.
spring.application.name=department-service
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ---------- Database ----------
spring.datasource.url=jdbc:mysql://localhost:3306/department_db
spring.datasource.username=department
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---------- RabbitMQ (events) ----------
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
ems.events.exchange=ems.events
ems.events.queue=department.employee-events
# Artificial work per message (ms). 0 normally; raise it to demo KEDA scaling on queue length.
ems.events.consumer-delay-ms=0
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# ---------- Actuator: probes and metrics ----------
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,rabbit

# ---------- Logging (stdout only, see logback-spring.xml) ----------
logging.level.root=INFO
